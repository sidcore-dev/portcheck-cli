[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portcheck-cli"
version = "1.0.0"
description = "Check whether a single host:port is accepting TCP connections, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["tcp", "port", "network", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
portcheck-cli = "portcheck_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
